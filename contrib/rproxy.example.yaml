# rproxy-api の設定ファイルの例（RPROXY_CONFIG=/etc/rproxy/rproxy.yaml）。docs/API.md の「設定ファイル」
version: 1

# 証明書を ACME（Let's Encrypt など）で取るとき（docs/API.md の「ACME の証明書」）。
# ルールの tls.certificates に {acme: letsencrypt, domains: [...]} と書く。80 / 443 番に CA が届くこと
# global:
#   acme:
#     storage: /var/lib/rproxy/acme
#     resolvers:
#       letsencrypt: {email: admin@example.com, challenge: tls-alpn-01}

rules:
  # ダッシュボード（Web UI）を dashboard.proxy.home だけで、社内のネットワークから 443 で受け付ける
  - protocol: tcp
    listen_addr: 0.0.0.0
    listen_port: 443
    remote_addr: 127.0.0.1
    remote_port: 3000
    allow_from: [172.16.0.0/16]
    tls:
      mode: terminate
      certificates:
        - cert_file: /etc/rproxy/certs/dashboard.pem
          chain_file: /etc/rproxy/certs/intermediates.pem
          key_file: /etc/rproxy/certs/dashboard.key
      routes:
        - {server_name: dashboard.proxy.home, remote_addr: 127.0.0.1, remote_port: 3000}
      unmatched: reject
