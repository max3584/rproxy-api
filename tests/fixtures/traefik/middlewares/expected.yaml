# Converted from the Traefik configuration by rproxy-traefik-convert.
# Check it before use; see docs/MIGRATING-FROM-TRAEFIK.md.
#
# Not converted / to check:
# - providers.docker: Docker labels are read only with --docker (docker inspect output)
# - entryPoints.admin: http.sanitizePath: false: raw_path keeps paths as sent; unsafe with path-based authentication routes
# - entryPoints.admin: forwardedHeaders.insecure: list the proxies in global.trusted_proxies instead
# - middleware security: forceSTSHeader: rproxy sends HSTS only on HTTPS
# - middleware security: headers.isDevelopment is not converted
# - middleware upload: buffering.maxResponseBodyBytes is not converted
# - middleware upload: buffering.retryExpression is not converted
# - router cloud: healthCheck.hostname is not converted
# - router cloud: several rootCAs: only the first is used (concatenate them into one file)
# - router cloud: responseForwarding is not converted
# - middleware gzip: compress.excludedContentTypes is not converted
# - middleware sso: forwardAuth.tls is not converted
# - middleware sso: forwardAuth.authResponseHeadersRegex is not converted
# - router api: weighted service api-split: flattened into one service (weights multiplied)
# - middleware strip-slash: stripPrefix.forceSlash is not converted
# - middleware per-host: rateLimit by request host is not converted; limited per client IP
# - middleware per-host: ipStrategy is not converted; rproxy uses global.trusted_proxies for the client IP
# - middleware unlimited: rateLimit.average 0 means no limit; left out
# - middleware no-limit-buffer: buffering without maxRequestBodyBytes is not converted
# - middleware latency-only: circuitBreaker expression 'LatencyAtQuantileMS(50.0) > 100' cannot be converted (only NetworkErrorRatio / ResponseCodeRatio); left out
# - middleware office: ipStrategy is not converted; rproxy uses global.trusted_proxies for the client IP
# - middleware office: rejectStatusCode is not converted (rproxy answers 403)
# - middleware in-flight: inFlightReq.sourceCriterion is not converted; counted per client IP
# - middleware breaker: circuitBreaker expression 'ResponseCodeRatio(500, 600, 0, 600) > 0.25 || LatencyAtQuantileMS(50.0) > 100': only 'ResponseCodeRatio(500, 600, 0, 600) > 0.25' is used
# - middleware breaker: circuitBreaker ResponseCodeRatio: rproxy counts 5xx and connection failures as failures
# - middleware digest: middleware type digestAuth has no rproxy equivalent; left out
# - middleware geoblock: plugin geoblock has no rproxy equivalent; left out
# - middleware two-kinds: not one middleware type; left out
# - router admin: middleware missing is not defined (or not from the file provider); left out
# - router admin: mirroring service shadowed: only its main service legacy is used (add a mirror middleware to the routes by hand to copy requests)
# - tls.options.strict: cipher suite TLS_RSA_WITH_AES_128_CBC_SHA is not available in rproxy; left out
# - tls.options.strict: maxVersion / curvePreferences / sniStrict are not converted
# - router plain-http: healthCheck.hostname is not converted
# - router plain-http: several rootCAs: only the first is used (concatenate them into one file)
# - router plain-http: responseForwarding is not converted
# - router templated: v2 host placeholders converted to HostRegexp
# - router templated: healthCheck.hostname is not converted
# - router templated: several rootCAs: only the first is used (concatenate them into one file)
# - router templated: responseForwarding is not converted
# - router unknown-matcher: matcher Foo has no rproxy equivalent; router left out
# - router on-web: on entry point web, which redirects everything; left out there
# - metrics: rproxy serves Prometheus metrics at GET /metrics of its control API
# - entry point websecure: routers without TLS on a TLS entry point are left out: plain-http
# - accessLog: Traefik logs to stdout; rproxy writes http.access lines to its own log unless global.access_log is set

version: 1
rules:
- protocol: tcp
  listen_addr: 0.0.0.0
  listen_port: 80
  http:
    routes:
    - name: redirect
      match: PathPrefix(`/`)
      priority: 1000000
      middlewares:
      - redirect
    middlewares:
      redirect:
        redirect_scheme:
          scheme: https
          permanent: false
          port: 8443
- protocol: tcp
  listen_addr: 192.0.2.1
  listen_port: 8443
  tls:
    mode: terminate
    certificates:
    - cert_file: /etc/traefik/certs/wildcard.example.com.pem
      key_file: /etc/traefik/certs/wildcard.example.com.key
    options:
      min_version: '1.2'
      cipher_suites:
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    client_auth:
      mode: required
      ca_file: /etc/traefik/ca/clients.pem
    alpn:
    - h2
    - http/1.1
    upstream:
      ca_file: /etc/traefik/ca/internal.pem
      server_name: cloud.internal.example.com
  http:
    routes:
    - name: cloud
      match: Host(`cloud.example.com`)
      priority: 10
      service: cloud
      middlewares:
      - security
      - well-known
      - upload
      - retry-slow
    - name: api
      match: Host(`api.example.com`) && PathPrefix(`/api/v1`)
      service: api-split
      middlewares:
      - security
      - api-v1
      - per-token
      - gzip
      - sso
    - name: legacy
      match: Host(`legacy.example.com`) && Path(`/old`)
      service: legacy
      middlewares:
      - security
      - old-path
      - add-app
      - strip-slash
      - per-host
    - name: admin
      match: Host(`admin.example.com`) && ClientIP(`192.0.2.0/24`)
      service: shadowed
      middlewares:
      - security
      - office
      - users
      - in-flight
      - breaker
    - name: to-dashboard
      match: Host(`traefik.example.com`)
      middlewares:
      - security
      - to-https
    - name: templated
      match: HostRegexp(`^(?:(?:[a-z]+)\.example\.org|example\.org)$`) || Method(`PURGE`)
      service: cloud
      middlewares:
      - security
    services:
      cloud:
        servers:
        - url: https://192.0.2.10:443
          weight: 2
        - url: https://192.0.2.11:443
        pass_host_header: false
        health_check:
          path: /status.php
          interval: 30s
          timeout: 5s
      api-split:
        servers:
        - url: http://192.0.2.20:8080
          weight: 3
        - url: http://192.0.2.21:8080
          weight: 2
      legacy:
        servers:
        - url: http://[2001:db8::30]:8080
      shadowed:
        servers:
        - url: http://[2001:db8::30]:8080
    middlewares:
      security:
        headers:
          request:
            set:
              X-Forwarded-Proto: https
            remove:
            - X-Remove-Me
          response:
            set:
              X-Frame-Options: SAMEORIGIN
              X-XSS-Protection: 1; mode=block
              Permissions-Policy: camera=(), microphone=()
            remove:
            - X-Powered-By
          hsts:
            max_age: 63072000
            include_subdomains: false
            preload: true
          csp: default-src 'self'
          cors:
            allow_origins:
            - https://app.example.com
            - https://admin.example.com
            allow_methods:
            - GET
            - POST
            allow_headers:
            - X-Token
            allow_credentials: true
            max_age: 600
      well-known:
        redirect_regex:
          regex: ^https://(.*)/.well-known/(card|cal)dav
          replacement: https://${1}/remote.php/dav/
          permanent: true
      upload:
        buffering:
          max_request_body: 2000000
      retry-slow:
        retry:
          attempts: 4
          initial_interval: 250ms
      api-v1:
        replace_path_regex:
          regex: ^/api/v1/(.*)
          replacement: /v1/$1
      per-token:
        rate_limit:
          average: 50
          period: 10s
          source: header:X-Token
      gzip:
        compress:
          encodings:
          - zstd
          - gzip
      sso:
        forward_auth:
          address: https://auth.example.com/verify
          request_headers:
          - Accept
          - X-CustomHeader
      old-path:
        replace_path:
          path: /new
      add-app:
        add_prefix:
          prefix: /app
      strip-slash:
        strip_prefix:
          prefixes:
          - /static
      per-host:
        rate_limit:
          average: 10
          period: 1s
      office:
        ip_allow:
          source_range:
          - 192.0.2.0/24
          - 2001:db8::/32
      users:
        basic_auth:
          users_file: /etc/traefik/users.htpasswd
          realm: Admin
          user_header: X-WebAuth-User
      in-flight:
        in_flight:
          amount: 20
      breaker:
        circuit_breaker:
          failure_percent: 25
          window: 10s
          recovery: 90s
      to-https:
        redirect_scheme:
          scheme: https
          permanent: false
          port: 8443
- protocol: tcp
  listen_addr: 2001:db8::1
  listen_port: 9443
  proxy_protocol:
    from:
    - 198.51.100.0/24
    required: false
  tls:
    mode: terminate
    certificates:
    - cert_file: /etc/traefik/certs/wildcard.example.com.pem
      key_file: /etc/traefik/certs/wildcard.example.com.key
    options:
      min_version: '1.2'
      cipher_suites:
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    client_auth:
      mode: required
      ca_file: /etc/traefik/ca/clients.pem
    alpn:
    - h2
    - http/1.1
  http:
    raw_path: true
    routes:
    - name: admin
      match: Host(`admin.example.com`) && ClientIP(`192.0.2.0/24`)
      service: shadowed
      middlewares:
      - office
      - users
      - in-flight
      - breaker
    services:
      shadowed:
        servers:
        - url: http://[2001:db8::30]:8080
    middlewares:
      office:
        ip_allow:
          source_range:
          - 192.0.2.0/24
          - 2001:db8::/32
      users:
        basic_auth:
          users_file: /etc/traefik/users.htpasswd
          realm: Admin
          user_header: X-WebAuth-User
      in-flight:
        in_flight:
          amount: 20
      breaker:
        circuit_breaker:
          failure_percent: 25
          window: 10s
          recovery: 90s
