# Converted from the Traefik configuration by rproxy-traefik-convert.
# Check it before use; see docs/MIGRATING-FROM-TRAEFIK.md.
#
# Not converted / to check:
# - serversTransport: insecureSkipVerify: applies to every https:// backend of the rule in rproxy
# - tcp router submission: combined rule: only its HostSNI part is used
# - tcp router submission-alt: backend address 'not-an-address' not understood; left out
# - tcp router submission-alt: service postfix-pool: healthCheck is not converted (rproxy checks L4 targets with a TCP connection: health_check)
# - tcp router weird: HostSNIRegexp `^(smtp|mail)\.example\.org$` is not a plain suffix; not converted (rproxy takes names, *.suffix for one label and **.suffix for any depth)
# - tcp router weird: ALPN is not converted (rproxy L4 routes by SNI only)
# - tls.options.modern: maxVersion / curvePreferences / sniStrict are not converted
# - tcp router imap2: entry point tls13: routers use different TLS options; rproxy has one set per rule
# - udp router game-copy: entry point games already has a UDP router; left out
# - udp router nowhere: service missing is not defined
# - udp router nowhere: service missing has no servers; left out
# - certificates: get www.example.net with certbot (or cert-manager, or rproxy's own ACME: global.acme, docs/en/ACME.md) into /etc/letsencrypt/live/www.example.net/; rproxy re-reads renewed files by itself
# - certificates: get mail.example.net with certbot (or cert-manager, or rproxy's own ACME: global.acme, docs/en/ACME.md) into /etc/letsencrypt/live/mail.example.net/; rproxy re-reads renewed files by itself
# - certificates: get *.mx.example.net with certbot (or cert-manager, or rproxy's own ACME: global.acme, docs/en/ACME.md) into /etc/letsencrypt/live/mx.example.net/; rproxy re-reads renewed files by itself
# - certificatesResolvers: le: not converted (--certs certbot); use certbot / cert-manager and point cert_file / key_file at the files
# - certificatesResolvers: zone: not converted (--certs certbot); use certbot / cert-manager and point cert_file / key_file at the files
# - entry point smtps: ClientIP of TCP routers applies to the whole rule (allow_from)
# - entry point tls13: routers use different PROXY protocol versions; rproxy has one per rule for terminated routes and the default (the first is used)
# - entry point tls13: no certificate found; put one at /etc/rproxy/tls/tls13.pem
# - entry point mixed: a HostSNI(`*`) passthrough router cannot share a port with terminating routers; terminating routers left out: term

version: 1
rules:
- protocol: tcp
  listen_addr: 0.0.0.0
  listen_port: 443
  tls:
    mode: terminate
    certificates:
    - cert_file: /etc/letsencrypt/live/www.example.net/fullchain.pem
      key_file: /etc/letsencrypt/live/www.example.net/privkey.pem
    routes:
    - server_name: '**.tenant.example.net'
      remote_addr: 192.0.2.45
      remote_port: 443
      passthrough: true
      source_ip: proxy_v2
  http:
    routes:
    - name: site
      match: Host(`www.example.net`)
      service: site
    services:
      site:
        servers:
        - url: http://192.0.2.80:8080
- protocol: tcp
  listen_addr: 0.0.0.0
  listen_port: 465
  remote_addr: 192.0.2.25
  remote_port: 25
  allow_from:
  - 192.0.2.0/24
  - 2001:db8::/32
  tls:
    mode: terminate
    certificates:
    - cert_file: /etc/letsencrypt/live/mail.example.net/fullchain.pem
      key_file: /etc/letsencrypt/live/mail.example.net/privkey.pem
    - cert_file: /etc/letsencrypt/live/mx.example.net/fullchain.pem
      key_file: /etc/letsencrypt/live/mx.example.net/privkey.pem
    routes:
    - server_name: mail.example.net
      remote_addr: 192.0.2.25
      remote_port: 25
    - server_name: '*.mx.example.net'
      remote_addr: 192.0.2.26
      remote_port: 25
- protocol: tcp
  listen_addr: 0.0.0.0
  listen_port: 993
  remote_addr: 192.0.2.43
  remote_port: 143
  source_ip: proxy_v1
  tls:
    mode: terminate
    certificates:
    - cert_file: /etc/rproxy/tls/tls13.pem
      key_file: /etc/rproxy/tls/tls13.key
    options:
      min_version: '1.3'
    routes:
    - server_name: imap.example.net
      remote_addr: 192.0.2.43
      remote_port: 143
    - server_name: imap2.example.net
      remote_addr: 192.0.2.44
      remote_port: 143
    unmatched: reject
- protocol: tcp
  listen_addr: 0.0.0.0
  listen_port: 8443
  remote_addr: 2001:db8::40
  remote_port: 443
  tls:
    mode: sni
    routes:
    - server_name: term.example.net
      remote_addr: 192.0.2.41
      remote_port: 8080
- protocol: tcp
  listen_addr: 0.0.0.0
  listen_port: 9443
  remote_addr: 192.0.2.45
  remote_port: 443
  source_ip: proxy_v2
  tls:
    mode: sni
    routes:
    - server_name: a.edge.example.net
      remote_addr: 192.0.2.45
      remote_port: 443
    - server_name: b.edge.example.net
      remote_addr: 2001:db8::40
      remote_port: 443
      source_ip: proxy
    unmatched: reject
- protocol: udp
  listen_addr: 198.51.100.5
  listen_port: 27015
  targets:
  - addr: 192.0.2.60
    port: 27015
    weight: 6
  - addr: 192.0.2.61
    port: 27015
