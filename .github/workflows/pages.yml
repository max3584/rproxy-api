name: Pages (config)

# 設定を作るページ（site/config、#406）を gh-pages の config/ に載せる：https://max3584.github.io/rproxy-api/config/
# 書くのは config/ だけ（scripts/publish-config-page.sh）。同じブランチの apt の置き場（dists/・pool/・
# rproxy-archive-keyring.gpg・index.html）は release.yml の apt ジョブが書き、こちらは触らない。
# どちらも --force なしで push し、相手が間に push していたら、こちらは新しい gh-pages からやり直し、
# apt は自分のコミットを新しい gh-pages の上に載せ直す。concurrency の組を apt と共有しないのは、
# 待っているジョブが新しく来たジョブに取り消されるため（apt の公開が取り消されないように）。
# 出力の中身の検査は CI の config page のジョブ（scripts/check-config-page.sh）。
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/publish-config-page.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# 走っているものは最後まで（gh-pages の push の途中で止めない）。待っている古いものは新しいものに
# 置き換わるが、新しいものほど新しい master を載せるので失うものはない
concurrency:
  group: pages-config
  cancel-in-progress: false

jobs:
  publish:
    name: publish site/config to gh-pages
    # master のものだけ（ほかのブランチからの workflow_dispatch で見ていない JS を載せない）
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: |
          apk add --no-cache bash git
          # the workspace belongs to the runner's user, not to root in the container
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      # 古い実行（やり直し・遅れて動いたもの）は載せない：このコミットがまだ master の先頭のときだけ。
      # 先頭が進んでいれば、その push の実行が新しいものを載せる
      - name: still master's head
        id: head
        run: |
          git fetch --quiet --depth 1 origin master
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_SHA is no longer master's head ($(git rev-parse FETCH_HEAD)); not publishing"
          fi
      - name: scripts/publish-config-page.sh
        if: steps.head.outputs.latest == 'true'
        run: scripts/publish-config-page.sh origin
