name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: clippy + tests (with MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rproxy_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit + integration tests
        env:
          RPROXY_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/rproxy_test
        run: cargo test --all-targets

  transparent:
    name: transparent mode (network namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      # Ubuntu blocks unprivileged user namespaces by default; allow them so the
      # script can build its isolated namespaces as the normal runner user.
      - name: allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: iptables and nftables
        run: sudo apt-get install -y iptables nftables
      # the three ways of routing the return traffic in the README
      - name: scripts/test-transparent.sh (ip rule iif)
        run: ROUTING=iif scripts/test-transparent.sh
      - name: scripts/test-transparent.sh (iptables -m socket)
        run: ROUTING=iptables scripts/test-transparent.sh
      - name: scripts/test-transparent.sh (nftables socket transparent)
        run: ROUTING=nft scripts/test-transparent.sh

  deb:
    name: Debian package (install, apt repository, purge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb
      - name: scripts/test-deb.sh
        run: scripts/test-deb.sh target/debian/*.deb

  install:
    name: install.sh (binary and apt, on a systemd VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: shellcheck
        run: shellcheck scripts/*.sh contrib/rproxy-transparent-routing
      - run: cargo build --release
      - name: scripts/test-install.sh
        run: sudo scripts/test-install.sh target/release/rproxy-api
