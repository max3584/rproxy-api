name: Cross build

# Release targets are otherwise built only when a v* tag is pushed. Build them on
# pull requests that change dependencies (Renovate, manual upgrades) so an update
# that breaks only arm / musl is caught before it is merged.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - Cross.toml
      - .github/workflows/cross.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same targets as release.yml (x86_64-unknown-linux-gnu is covered by ci.yml)
        target:
          - x86_64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (release profile, like release.yml)
        run: cross build --release --target ${{ matrix.target }}
