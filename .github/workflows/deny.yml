name: Dependencies (cargo-deny)

# Checks Cargo.lock against the RustSec advisory database (vulnerable,
# unmaintained, yanked), licenses and sources (deny.toml). Runs on pull requests
# that change dependencies and every day, since new advisories appear without
# any change here. Not a required check.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check
