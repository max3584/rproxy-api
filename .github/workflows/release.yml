name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v*
  # rproxy-ui の .deb を apt リポジトリに載せる。UI は rproxy-api と別に版を
  # 進めるので、UI のリリースの後にここを手動で実行する。rproxy-api はビルドしない
  # （docs/RELEASING.md）
  workflow_dispatch:
    inputs:
      ui_tag:
        description: "TCP-UDP-rproxy-ui のリリースのタグ（例 v0.3.16）"
        required: true

jobs:
  # Alpine（musl）のコンテナで 6 つのターゲットをビルドする（#191）。musl の x86_64 はそのまま、ほかは
  # cargo-zigbuild（zig）でクロスビルドし、gnu は glibc 2.17 向けにリンクする（scripts/build-release.sh）。
  # .deb は musl の静的リンクのバイナリから作る。同じ手順を cross.yml が PR で確かめる
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: alpine:3.24
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu       , extension: "" }
          - { target: x86_64-unknown-linux-musl      , extension: ""   , deb: amd64 }
          - { target: armv7-unknown-linux-gnueabihf  , extension: "" }
          - { target: armv7-unknown-linux-musleabihf , extension: ""   , deb: armhf }
          - { target: aarch64-unknown-linux-gnu      , extension: "" }
          - { target: aarch64-unknown-linux-musl     , extension: ""   , deb: arm64 }
    steps:
      - name: Packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev zig cargo-zigbuild dpkg

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract crate information
        shell: bash
        run: |
          echo "PROJECT_NAME=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> $GITHUB_ENV
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "VERSION=v$version" >> $GITHUB_ENV
          # the .deb version comes from Cargo.toml, so the tag has to match it
          if [ "${{ github.ref_type }}" = tag ] && [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      # the self-update's release key (minisign.pub's base64 line, #174) is built in when
      # the repository variable MINISIGN_PUBLIC_KEY is set (docs/RELEASING.md)
      - name: Build
        env:
          RPROXY_RELEASE_PUBKEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: scripts/build-release.sh ${{ matrix.job.target }}

      # cargo-deb publishes only a glibc build (a .deb), so build it here
      - name: Install cargo-deb
        if: matrix.job.deb
        run: cargo install --locked cargo-deb

      # static musl binaries, so one package works on every Debian / Ubuntu release
      - name: Debian package
        if: matrix.job.deb
        shell: bash
        run: |
          deb=$(cargo deb --no-build --no-strip --target ${{ matrix.job.target }} --output target/deb/ | tail -n1)
          [ "$(dpkg-deb --field "$deb" Architecture)" = "${{ matrix.job.deb }}" ]
          echo "DEB=$deb" >> $GITHUB_ENV

      - name: Upload Debian package
        if: matrix.job.deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.job.deb }}
          path: ${{ env.DEB }}

      - name: Rename artifacts
        shell: bash
        run: |
          mv target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}{,-${{ env.VERSION }}-${{ matrix.job.target }}${{ matrix.job.extension }}}

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-${{ matrix.job.target }}${{ matrix.job.extension }}
            ${{ env.DEB }}

  # The self-update's files (#174, docs/UPGRADE.md): manifest.json (version, whether a
  # live upgrade may swap it in, SHA-256 of each binary), SHA256SUMS, releases.json (the
  # index of every release; read from the latest release), and minisign
  # signatures of the binaries and of both. The secret key is the repository secret
  # MINISIGN_SECRET_KEY (the whole key file of `minisign -G -W`: no password); without
  # it the files are published unsigned with a warning, and the self-update skips the
  # release. Key generation: docs/RELEASING.md
  sign:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container: alpine:3.24
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Packages
        run: apk add --no-cache bash git github-cli minisign coreutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Manifest and signatures
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          mkdir -p "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'rproxy-api-v*'
          rm -f ./*.minisig
          version=${TAG#v}
          # an exception patch that cannot be swapped in live (docs/RELEASING.md)
          handoff=true
          [ -e "$GITHUB_WORKSPACE/debian/restart-required" ] && handoff=false
          sha256sum rproxy-api-v* > SHA256SUMS
          {
            printf '{"version":"%s","handoff":%s,"files":{' "$version" "$handoff"
            first=1
            while read -r sum name; do
              [ $first = 1 ] || printf ','
              first=0
              printf '"%s":"%s"' "$name" "$sum"
            done < SHA256SUMS
            printf '}}\n'
          } > manifest.json
          cat manifest.json
          # the release index (the self-update reads it at <releases>/latest/download/releases.json):
          # every published release of every minor, so skipped patch numbers do not matter
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --exclude-pre-releases \
            --json tagName -q '.[].tagName' > tags.txt
          echo "$TAG" >> tags.txt
          grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' tags.txt | sort -uV | sed 's/^v//' |
            awk 'BEGIN { printf "{\"releases\":[" } NR > 1 { printf "," } { printf "{\"version\":\"%s\"}", $0 } END { print "]}" }' > releases.json
          cat releases.json
          files=(manifest.json SHA256SUMS releases.json)
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            umask 077
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
            for f in rproxy-api-v* manifest.json SHA256SUMS releases.json; do
              minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "rproxy-api $TAG $f" </dev/null
            done
            rm -f "$RUNNER_TEMP/minisign.key"
            files+=(./*.minisig)
          else
            echo "::warning::MINISIGN_SECRET_KEY is not set; the release is not signed and the self-update (RPROXY_UPDATE) will not use it"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  # Publishes the packages to the apt repository on the gh-pages branch
  # (https://max3584.github.io/rproxy-api/). Needs the repository secrets
  # APT_GPG_PRIVATE_KEY (ASCII-armored secret key without a passphrase) and
  # APT_GPG_KEY_ID; skipped when they are not set. See docs/APT.md.
  # apt-ftparchive（apt-utils）は Debian の道具なので、ここだけ debian:13-slim のコンテナで動かす（#191。
  # 同じ手順を cross.yml の apt (dry run) が使い捨ての鍵で確かめる）
  apt:
    needs: build
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref_type == 'tag' && needs.build.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    container: debian:13-slim
    concurrency:
      group: apt-repository
      cancel-in-progress: false
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
      # 手動のときだけ使う（入力した UI のタグ）
      UI_TAG: ${{ inputs.ui_tag }}
    steps:
      - name: Check signing key
        id: key
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ] && [ -n "$APT_GPG_KEY_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APT_GPG_PRIVATE_KEY / APT_GPG_KEY_ID are not set; the apt repository is not updated"
          fi

      - name: Packages
        if: steps.key.outputs.ok
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates gnupg apt-utils dpkg-dev curl gh
          # the workspace belongs to the runner's user, not to root in the container
          git config --global --add safe.directory '*'

      - name: Checkout
        if: steps.key.outputs.ok
        uses: actions/checkout@v4

      - name: Checkout gh-pages
        if: steps.key.outputs.ok
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages pages
          fi

      - name: Download packages
        if: steps.key.outputs.ok && github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true

      # the UI has its own version numbers (docs/RELEASING.md): a tag push
      # publishes rproxy-api only, and the UI .deb comes by hand with ui_tag
      - name: Download rproxy-ui
        if: steps.key.outputs.ok && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download "$UI_TAG" -R max3584/TCP-UDP-rproxy-ui -p 'rproxy-ui_*_all.deb' -D debs; then
            echo "::error::no rproxy-ui .deb in TCP-UDP-rproxy-ui $UI_TAG"
            exit 1
          fi
          ls debs

      - name: Update the repository
        if: steps.key.outputs.ok
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          scripts/apt-repo.sh pages debs/*.deb
          cp docs/apt-index.html pages/index.html

      - name: Push gh-pages
        if: steps.key.outputs.ok
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            git commit -m "apt: rproxy-ui $UI_TAG"
          else
            git commit -m "apt: ${{ github.ref_name }}"
          fi
          git push origin HEAD:gh-pages
