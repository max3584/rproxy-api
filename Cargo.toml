[package]
name = "rproxy-api"
version = "0.3.1"
edition = "2021"
authors = ["touka shiro / max3584 <max3584.work@gmail.com>"]
description = "L4 TCP/UDP forwarder managed through an HTTP API"
homepage = "https://github.com/max3584/rproxy-api"
repository = "https://github.com/max3584/rproxy-api"
readme = "README.md"
keywords = ["proxy", "tcp", "udp", "tls", "forwarder"]
categories = ["command-line-utilities", "network-programming"]
license = "MIT"
exclude = [
    ".gitignore",
    "Cargo.toml.orig",
    "Cargo.lock",
]

# Debian package (cargo deb). See debian/README.md.
[package.metadata.deb]
maintainer = "touka shiro / max3584 <max3584.work@gmail.com>"
copyright = "2024 max3584 / touka shiro, 2017 glacierx - rproxy project"
license-file = ["LICENSE", "0"]
extended-description = """\
Layer 4 TCP/UDP forwarder whose rules are added, changed and removed at run \
time through an HTTP API. Supports TLS SNI routing and termination, mTLS, \
DTLS termination, STARTTLS for SMTP/IMAP/POP3, port ranges and PROXY protocol."""
section = "net"
priority = "optional"
depends = "passwd"
# rproxy-traefik-convert (the Traefik configuration converter) runs on python3; YAML needs python3-yaml
suggests = "python3, python3-yaml"
maintainer-scripts = "debian/"
# not started on install: set /etc/rproxy/rproxy.env first, then systemctl enable --now rproxy-api
systemd-units = { enable = false, start = false }
assets = [
    ["target/release/rproxy-api", "usr/bin/", "755"],
    ["debian/rproxy.env", "etc/rproxy/rproxy.env", "640"],
    ["contrib/rproxy.example.yaml", "usr/share/doc/rproxy-api/examples/", "644"],
    ["README.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/API.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/PROFILES.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/MIGRATING-FROM-TRAEFIK.md", "usr/share/doc/rproxy-api/", "644"],
    ["contrib/traefik2rproxy.py", "usr/bin/rproxy-traefik-convert", "755"],
]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
socket2 = { version = "0.6", features = ["all"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
webrtc-dtls = { version = "0.12", features = ["pem"] }
webrtc-util = { version = "0.11", default-features = false, features = ["conn"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
x509-parser = "0.16"
async-trait = "0.1"
rcgen = "0.13"
if-addrs = "0.15"
serde_yaml_ng = "0.10.0"
regex = "1.13.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
flate2 = "1"
brotli = "8"
zstd = "0.13"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
bcrypt = { version = "0.17", default-features = false, features = ["std"] }
base64 = "0.22"
ring = "0.17"
time = { version = "0.3", features = ["formatting"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
# smaller release binaries and .deb packages (no separate debug symbols)
strip = true
