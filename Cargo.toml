[package]
name = "rproxy-api"
version = "0.3.15"
edition = "2021"
authors = ["touka shiro / max3584 <max3584.work@gmail.com>"]
description = "L4 TCP/UDP forwarder managed through an HTTP API"
homepage = "https://github.com/max3584/rproxy-api"
repository = "https://github.com/max3584/rproxy-api"
readme = "README.md"
keywords = ["proxy", "tcp", "udp", "tls", "forwarder"]
categories = ["command-line-utilities", "network-programming"]
license = "MIT"
exclude = [
    ".gitignore",
    "Cargo.toml.orig",
    "Cargo.lock",
]

# Debian package (cargo deb). See debian/README.md.
[package.metadata.deb]
maintainer = "touka shiro / max3584 <max3584.work@gmail.com>"
copyright = "2024 max3584 / touka shiro, 2017 glacierx - rproxy project"
license-file = ["LICENSE", "0"]
extended-description = """\
Layer 4 TCP/UDP forwarder whose rules are added, changed and removed at run \
time through an HTTP API. Supports TLS SNI routing and termination, mTLS, \
DTLS termination, STARTTLS for SMTP/IMAP/POP3, port ranges and PROXY protocol."""
section = "net"
priority = "optional"
depends = "passwd"
# rproxy-traefik-convert (the Traefik configuration converter) runs on python3; YAML needs python3-yaml
suggests = "python3, python3-yaml"
maintainer-scripts = "debian/"
# not started on install: set /etc/rproxy/rproxy.env first, then systemctl enable --now rproxy-api
systemd-units = { enable = false, start = false }
assets = [
    ["target/release/rproxy-api", "usr/bin/", "755"],
    ["debian/rproxy.env", "etc/rproxy/rproxy.env", "640"],
    ["contrib/rproxy.example.yaml", "usr/share/doc/rproxy-api/examples/", "644"],
    ["README.md", "usr/share/doc/rproxy-api/", "644"],
    ["README.en.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/API.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/en/API.md", "usr/share/doc/rproxy-api/en/", "644"],
    ["docs/PROFILES.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/en/PROFILES.md", "usr/share/doc/rproxy-api/en/", "644"],
    ["docs/SOURCE-IP.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/en/SOURCE-IP.md", "usr/share/doc/rproxy-api/en/", "644"],
    ["docs/MIGRATING-FROM-TRAEFIK.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/en/MIGRATING-FROM-TRAEFIK.md", "usr/share/doc/rproxy-api/en/", "644"],
    ["contrib/traefik2rproxy.py", "usr/bin/rproxy-traefik-convert", "755"],
    ["docs/CROWDSEC.md", "usr/share/doc/rproxy-api/", "644"],
    ["docs/en/CROWDSEC.md", "usr/share/doc/rproxy-api/en/", "644"],
    ["contrib/crowdsec/parsers/s01-parse/rproxy-logs.yaml", "usr/share/rproxy-api/crowdsec/parsers/s01-parse/", "644"],
    ["contrib/crowdsec/scenarios/rproxy-conn-denied.yaml", "usr/share/rproxy-api/crowdsec/scenarios/", "644"],
    ["contrib/crowdsec/scenarios/rproxy-conn-flood.yaml", "usr/share/rproxy-api/crowdsec/scenarios/", "644"],
    ["contrib/crowdsec/acquis.d/rproxy.yaml", "usr/share/rproxy-api/crowdsec/acquis.d/", "644"],
    ["contrib/crowdsec/acquis.d/appsec.yaml", "usr/share/rproxy-api/crowdsec/acquis.d/", "644"],
]

[package.metadata.cargo-machete]
# md-5 is used as `md5` (src/l7/middleware/auth.rs, htpasswd APR1)
ignored = ["md-5"]

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query", "form"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
socket2 = { version = "0.6.5", features = ["all"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
dtls = "0.17.2"
webrtc-util = { version = "0.17.2", default-features = false, features = ["conn"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
async-trait = "0.1.92"
if-addrs = "0.15"
serde_yaml_ng = "0.10.0"
regex = "1.13.1"
hyper = { version = "1.11.1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
futures-util = "0.3.34"
flate2 = "1.1.10"
brotli = "8.0.4"
zstd = "0.14.0"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
bcrypt = { version = "0.19.3", default-features = false, features = ["std"] }
base64 = "0.23.1"
ring = "0.17.14"
time = { version = "0.3.55", features = ["formatting"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

# criterion benchmarks (docs/TESTING.md); CI compares a PR with its merge base (.github/workflows/bench.yml)
[[bench]]
name = "parse"
harness = false

[[bench]]
name = "dataplane"
harness = false

[profile.release]
# smaller release binaries and .deb packages (no separate debug symbols)
strip = true

# the tests hash and (de)compress hundreds of MiB (tests/integrity.rs); without
# optimisation these crates are too slow in debug builds
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.brotli-decompressor]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
